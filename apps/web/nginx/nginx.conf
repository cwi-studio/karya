worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  # Karya: without a Cache-Control header browsers cache index.html heuristically (about a day), so a release
  # stays invisible until that expires. Hashed build assets never change; everything else is revalidated.
  map $uri $karya_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/go/assets/  "public, max-age=31536000, immutable";  # Karya Go
    default     "no-cache";
  }

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control $karya_cache_control always;  # Karya

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }

    # Karya Go: the phone app, its own single page with its own service worker.
    location = /go {
      absolute_redirect off;  # behind the proxy: keep the browser's host and scheme
      return 301 /go/;
    }
    location /go/ {
      root   /usr/share/nginx/html;
      try_files $uri /go/index.html;
    }
  }
}

