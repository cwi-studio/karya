# Karya overlay on Plane's release compose. Use:
#   docker compose --env-file plane.env -p plane -f docker-compose.yml -f docker-compose.karya.yml up -d
# Only images change (built by karya/deploy/build.sh); the proxy stays upstream's.
services:
  web:
    image: karya-web:${KARYA_RELEASE:-1.4.2-k1}
  space:
    image: karya-space:${KARYA_RELEASE:-1.4.2-k1}
  admin:
    image: karya-admin:${KARYA_RELEASE:-1.4.2-k1}
  live:
    image: karya-live:${KARYA_RELEASE:-1.4.2-k1}
  api:
    image: karya-backend:${KARYA_RELEASE:-1.4.2-k1}
    # Karya Go (/go/): speech-to-text and the model that drafts tickets. Empty = voice off / sentence becomes the title.
    environment:
      KARYA_GO_STT_KEY: ${KARYA_GO_STT_KEY:-}
      KARYA_GO_STT_MODEL: ${KARYA_GO_STT_MODEL:-saaras:v3}
      KARYA_GO_STT_MODE: ${KARYA_GO_STT_MODE:-codemix}
      KARYA_GO_LLM_URL: ${KARYA_GO_LLM_URL:-https://api.sarvam.ai/v1/chat/completions}
      KARYA_GO_LLM_KEY: ${KARYA_GO_LLM_KEY:-}
      KARYA_GO_LLM_MODEL: ${KARYA_GO_LLM_MODEL:-sarvam-105b-conversations}
  worker:
    image: karya-backend:${KARYA_RELEASE:-1.4.2-k1}
  beat-worker:
    image: karya-backend:${KARYA_RELEASE:-1.4.2-k1}
  migrator:
    image: karya-backend:${KARYA_RELEASE:-1.4.2-k1}
  # ops.cwistudio.in (the first address, in the 2 Oct invites) -> karya.cwistudio.in, permanently.
  karya-redirect:
    image: caddy:2-alpine
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command: ['printf ":80 {\n  redir https://karya.cwistudio.in{uri} permanent\n}\n" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile']
    ports:
      - target: 80
        host_ip: 127.0.0.1
        published: 8091
        protocol: tcp
        mode: host
  # Loopback only: reached over the restricted SSH tunnel (operation-room/runbooks/db-tunnel-access.md).
  plane-db:
    ports:
      - "127.0.0.1:15433:5432"
